# Eclipse Mosquitto 2 configuration for both brokers of the system.
# Mounted at /mosquitto/config/mosquitto.conf in the container.

# Without a declared listener Mosquitto 2 accepts connections from the same
# computer only, which inside a container means from nowhere. With a listener it
# rejects clients that present no user name, so anonymous access is opened here.
# The broker is published on 127.0.0.1 only, so it is not reachable from the
# network of the host.
listener 1883
allow_anonymous true

# The history of readings must survive a restart of the broker.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Nagle's algorithm would delay the PUBACK of QoS 1 by up to 40 ms. Without this
# line the gateway of session 2 saturates at about 2000 messages/s with an idle
# processor, because every acknowledgement waits for the next one.
#
# The keyword is set_tcp_nodelay in Mosquitto 2.1.4, which is the version of the
# pinned image. Earlier builds of 2.1 accepted tcp_nodelay and reject this one,
# and 2.0 rejects both, so the image tag and this line have to move together.
set_tcp_nodelay true
